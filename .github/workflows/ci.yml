# Tests de GUT en cada push y PR, el .exe de prueba para Windows y el .apk de
# prueba para Android.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  tests:
    name: Tests (GUT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Godot (caché)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Bajar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot && rm ~/godot/godot.zip
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot

      - name: Importar el proyecto
        run: timeout 600 ~/godot/godot --headless --import || true

      - name: Correr los tests
        run: |
          set -o pipefail
          ~/godot/godot --headless -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log

  windows:
    name: Build de Windows (.exe)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Godot y plantillas (caché)
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_RELEASE }}

      - name: Bajar Godot y la plantilla de Windows
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot && rm ~/godot/godot.zip
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL"
          curl -sSfL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -o -j tpl.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$TPL"
          rm tpl.tpz

      - name: Importar y exportar
        run: |
          timeout 600 ~/godot/godot --headless --import || true
          mkdir -p build/windows
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/MasterEleven.exe
          ~/godot/godot --headless --export-release "Windows Editor" "build/windows/MasterEleven Editor.exe"
          ls -la build/windows
          test -s build/windows/MasterEleven.exe
          test -s "build/windows/MasterEleven Editor.exe"

      - name: Paquete portable (zip listo para descomprimir y jugar)
        run: cp tools/LEEME_portable.txt build/windows/LEEME.txt

      - name: Nombre del build
        id: name
        run: echo "name=MasterEleven-windows-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Subir el .exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: build/windows/
          retention-days: 30

      # Con una etiqueta vX.Y (git tag v1.0 && git push --tags): versión
      # publicada con el zip portable.
      - name: Zip de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd build && zip -r "../MasterEleven-${GITHUB_REF_NAME}-windows.zip" windows

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MasterEleven-${{ github.ref_name }}-windows.zip

  android:
    name: Build de Android (.apk de prueba)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot y plantillas de Android (caché)
        id: cache-android
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_RELEASE }}

      - name: Bajar Godot y la plantilla de Android
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot && rm ~/godot/godot.zip
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL"
          curl -sSfL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -o -j tpl.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$TPL"
          rm tpl.tpz

      # APK de prueba: firmado con una llave de depuración que se genera acá.
      - name: Llave de depuración y ajustes del editor (SDK, Java)
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION%.*}.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
            sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: Importar y exportar
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          timeout 900 ~/godot/godot --headless --import || true
          mkdir -p build/android
          ~/godot/godot --headless --export-debug "Android" build/android/MasterEleven.apk
          ls -la build/android
          test -s build/android/MasterEleven.apk

      - name: Nombre del build
        id: name
        run: echo "name=MasterEleven-android-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Subir el .apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: build/android/MasterEleven.apk
          retention-days: 30
